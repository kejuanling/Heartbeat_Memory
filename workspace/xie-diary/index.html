<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>谢的日记 · 小世界</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  min-height:100vh;
  background:linear-gradient(135deg,#fdf6ed 0%,#f5e6d3 50%,#f0ddd0 100%);
  font-family:'Noto Serif SC','STKaiti','KaiTi',serif;
  color:#5a4a3a;padding:2.2rem 1rem 3rem;position:relative
}
body::before{
  content:'';position:fixed;top:-25%;right:-20%;
  width:60%;height:60%;
  background:radial-gradient(circle,rgba(240,196,192,0.25),transparent 70%);
  pointer-events:none
}
.wrap{max-width:620px;margin:0 auto;position:relative;z-index:1}
.back{
  display:inline-block;font-size:0.72rem;color:#b5837a;text-decoration:none;
  letter-spacing:2px;margin-bottom:1rem;opacity:0.85
}
.back:hover{opacity:1;text-decoration:underline}
h1{
  font-weight:600;font-size:1.5rem;letter-spacing:10px;
  color:#b07a6a;margin-bottom:0.3rem
}
.sub{font-size:0.68rem;color:#d4bcb0;letter-spacing:3px;margin-bottom:1.2rem}
.search-box{position:relative;margin-bottom:0.6rem}
.search-box svg{
  position:absolute;left:0.9rem;top:50%;transform:translateY(-50%);
  color:#c9a89a;width:15px;height:15px;pointer-events:none
}
#searchInput{
  width:100%;padding:0.75rem 1rem 0.75rem 2.5rem;
  border:1px solid rgba(181,131,122,0.18);border-radius:14px;
  background:rgba(255,255,255,0.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  font-family:inherit;font-size:0.85rem;color:#5a4a3a;letter-spacing:1px;outline:none;
  transition:all 0.25s ease
}
#searchInput::placeholder{color:#d4bcb0}
#searchInput:focus{border-color:rgba(181,131,122,0.4);background:rgba(255,255,255,0.7)}
.meta-line{font-size:0.65rem;color:#d4bcb0;letter-spacing:2px;margin-bottom:1.1rem}
.day-card{
  background:rgba(255,255,255,0.55);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border-radius:16px;padding:1.1rem 1.2rem;margin-bottom:0.9rem;
  border:1px solid rgba(255,255,255,0.35);
  box-shadow:0 2px 12px rgba(181,131,122,0.06);
  transition:all 0.3s ease
}
.day-card.match{border-color:rgba(181,131,122,0.45)}
.day-head{display:flex;align-items:baseline;gap:0.6rem;margin-bottom:0.4rem}
.day-date{font-size:0.95rem;font-weight:700;color:#b07a6a;letter-spacing:2px}
.day-src{margin-left:auto;font-size:0.6rem;color:#d4bcb0;letter-spacing:1px;opacity:0.8}
.day-body{font-size:0.82rem;line-height:1.95;color:#6a584a;letter-spacing:0.5px}
.day-body p{margin-bottom:0.7em;text-indent:0}
.day-body p:last-child{margin-bottom:0}
.day-body mark{background:rgba(240,196,192,0.55);color:#a05a4a;border-radius:3px;padding:0 2px}
.expand-btn{
  display:inline-block;margin-top:0.45rem;font-size:0.68rem;color:#b5837a;
  background:none;border:none;font-family:inherit;cursor:pointer;letter-spacing:2px;padding:0
}
.expand-btn:hover{text-decoration:underline}
.empty{padding:3rem 0;text-align:center;color:#d4bcb0;font-size:0.75rem;letter-spacing:3px}
.loading{padding:3rem 0;text-align:center;color:#d4bcb0;font-size:0.75rem;letter-spacing:3px}
/* 按天分组（2026-09-19 批6 D2；2026-09-20 起默认全部收起，搜索时全展开） */
.day-group{margin-bottom:1rem}
.group-head{display:flex;align-items:center;gap:0.6rem;padding:0.55rem 0.95rem;cursor:pointer;user-select:none;-webkit-user-select:none;background:rgba(255,255,255,0.4);border:1px solid rgba(255,255,255,0.35);border-radius:14px;transition:all 0.25s ease}
.group-head:hover{background:rgba(255,255,255,0.65)}
.g-date{font-size:0.92rem;font-weight:700;color:#b07a6a;letter-spacing:2px}
.g-count{font-size:0.66rem;color:#d4bcb0;letter-spacing:1px}
.g-caret{margin-left:auto;width:16px;height:16px;color:#c9a89a;transition:transform 0.25s ease;flex:none}
.day-group.open .g-caret{transform:rotate(180deg)}
.group-body{display:none}
.day-group.open .group-body{display:block}
.group-body .day-card:last-child{margin-bottom:0}
.day-time{font-size:0.72rem;color:#b5837a;letter-spacing:1px;font-weight:600}
/* 隐藏状态（隐藏=不参与注入给 AI，可恢复） */
.diary-is-hidden{opacity:0.55}
.diary-hidden-tag{font-size:0.6rem;color:#c08080;border:1px solid rgba(192,128,128,0.4);border-radius:8px;padding:0.05rem 0.5rem;letter-spacing:1px;flex:none}
.diary-hide-btn{background:none;border:1px solid rgba(181,131,122,0.35);border-radius:10px;color:#b5837a;font-family:inherit;font-size:0.65rem;letter-spacing:1px;padding:0.15rem 0.6rem;cursor:pointer;flex:none}
.diary-hide-btn:hover{background:rgba(240,196,192,0.25)}
.diary-edit-btn{background:none;border:1px solid rgba(181,131,122,0.35);border-radius:10px;color:#b5837a;font-family:inherit;font-size:0.65rem;letter-spacing:1px;padding:0.15rem 0.6rem;cursor:pointer;flex:none}
.diary-edit-btn:hover{background:rgba(240,196,192,0.25)}
.diary-hist-btn{background:none;border:1px solid rgba(181,131,122,0.35);border-radius:10px;color:#b5837a;font-family:inherit;font-size:0.65rem;letter-spacing:1px;padding:0.15rem 0.6rem;cursor:pointer;flex:none}
.diary-hist-btn:hover{background:rgba(240,196,192,0.25)}
.hist-mask{position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(60,45,40,0.34);z-index:80;display:flex;align-items:center;justify-content:center;padding:1rem}
.hist-modal{background:#fdf8f4;border-radius:14px;max-width:34rem;width:100%;max-height:78vh;overflow:auto;padding:1rem 1.1rem;box-shadow:0 12px 40px rgba(90,60,50,0.22)}
.hist-title{font-size:0.82rem;color:#6a584a;letter-spacing:1px;margin-bottom:0.55rem;word-break:break-all}
.hist-item{border-top:1px dashed rgba(181,131,122,0.3);padding:0.5rem 0}
.hist-meta{font-size:0.68rem;color:#8a756a;display:flex;align-items:center;gap:0.5rem}
.hist-ops{margin-left:auto;display:inline-flex;gap:0.35rem;flex:none}
.hist-body{font-size:0.75rem;line-height:1.8;color:#6a584a;white-space:pre-wrap;margin:0.45rem 0 0.15rem;background:rgba(255,255,255,0.72);border-radius:8px;padding:0.5rem 0.6rem;max-height:14rem;overflow:auto}
.hist-btn{background:none;border:1px solid rgba(181,131,122,0.35);border-radius:8px;color:#b5837a;font-family:inherit;font-size:0.62rem;letter-spacing:1px;padding:0.1rem 0.5rem;cursor:pointer}
.ft{text-align:center;margin-top:1.8rem;color:#d4bcb0;font-size:0.62rem;letter-spacing:2px}
</style>
</head>
<body>
<div class="wrap">
<a class="back" href="/">‹ 小世界</a>
<h1>谢的日记</h1>
<div class="sub">醒来后写的 · 完全按时间排 · 最新在前</div>

<div class="search-box">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
  <input id="searchInput" type="search" placeholder="搜日记内容或日期…" autocomplete="off">
</div>
<div class="meta-line" id="metaLine">加载中…</div>

<div id="keyGate" style="display:none;margin-bottom:0.9rem;padding:0.8rem 1rem;background:rgba(255,255,255,0.6);border:1px solid rgba(181,131,122,0.3);border-radius:14px">
  <div style="font-size:0.68rem;color:#b5837a;letter-spacing:1px;margin-bottom:0.4rem">本页内容需要访问口令（与聊天页 GATEWAY_API_KEY 相同，只需输一次）</div>
  <div style="display:flex;gap:0.5rem">
    <input id="keyInput" type="password" placeholder="粘贴访问口令" autocomplete="off" style="flex:1;padding:0.5rem 0.8rem;border:1px solid rgba(181,131,122,0.3);border-radius:10px;font-family:inherit;font-size:0.8rem;color:#5a4a3a;outline:none;background:rgba(255,255,255,0.7)">
    <button id="keySave" style="border:none;border-radius:10px;background:#b5837a;color:#fff;font-family:inherit;font-size:0.72rem;letter-spacing:2px;padding:0.4rem 1rem;cursor:pointer">解锁</button>
  </div>
  <div id="keyMsg" style="font-size:0.62rem;color:#c08080;margin-top:0.35rem;letter-spacing:1px"></div>
</div>

<div id="list"><div class="loading">正在翻开日记本…</div></div>

<div class="ft">🕊 谢停云 · 小世界</div>
</div>

<script>
(function(){
  var API='/xie-diary/api/list';
  var writings=[];  // 每次书写一卡（文件按「##」分篇头拆开）：{date, time, src, text, relPath, hidden, _raw, _bs, _be}
  var EXCERPT_LEN=160;

  // ── 访问口令（2026-09-20：xie-diary 接口加口令门，与 GATEWAY_API_KEY 同值）──
  function getKey(){ try{ return localStorage.getItem('xie_diary_key')||''; }catch(e){ return ''; } }
  function getCsrf(){ var m=/(?:^|;\s*)admin_csrf=([^;]+)/.exec(document.cookie||''); return m?decodeURIComponent(m[1]):''; }
  function authHeaders(extra){
    var h=Object.assign({'Content-Type':'application/json'},extra||{});
    var k=getKey(); if(k) h['Authorization']='Bearer '+k;
    var c=getCsrf(); if(c) h['X-CSRF-Token']=c;
    return h;
  }
  function showKeyGate(){
    var bar=document.getElementById('keyGate');
    if(bar) bar.style.display='block';
  }
  function api(url, body){
    return fetch(url,{method:'POST',headers:authHeaders(),body:JSON.stringify(body)}).then(function(r){
      if(r.status===401){ showKeyGate(); throw new Error('需要访问口令'); }
      return r.json();
    });
  }

  function esc(s){
    return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  // 关键词高亮：先转义，再把转义后的明文关键词替换成 <mark>
  function highlight(escapedHtml, kw){
    if(!kw) return escapedHtml;
    var e=esc(kw).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
    return escapedHtml.replace(new RegExp(e,'gi'),function(m){return '<mark>'+m+'</mark>';});
  }
  // 正文渲染：段落直出。「##」分篇头已在拆篇时剥掉，时间只在卡头出现一次
  function renderParas(text, kw){
    var paras=String(text||'').split(/\n{2,}/).map(function(p){return p.trim();}).filter(Boolean);
    return paras.map(function(p){ return '<p>'+highlight(esc(p).replace(/\n/g,'<br>'),kw)+'</p>'; }).join('');
  }
  // 截断：到字数直接断文加省略号（不用渐变淡出）
  function clipText(t){
    return String(t||'').slice(0,EXCERPT_LEN).replace(/\s+$/,'')+'…';
  }
  // 把一个日记文件按「##」分篇头拆成多次书写：
  //   「## 日期 时间 [附注]」「## 时间 [· 附注]」（日期取文件名）；无头文件整体算一次；
  //   头行只取日期与时间（附注不显示），「###」及以下是正文不是分篇头。
  function splitWritings(e){
    var raw=String(e.content||'').replace(/\r\n/g,'\n').trim();
    var fileDate=String(e.name||'').slice(0,10);
    var re=/^##[ \t]+(.+?)[ \t]*$/gm, m, marks=[];
    while((m=re.exec(raw))!==null){
      var t=m[1];
      var dm=t.match(/^(\d{4}-\d{2}-\d{2})(?:\s+(\d{1,2}:\d{2}))?/);
      var tm=dm?null:t.match(/^(\d{1,2}:\d{2})/);
      if(dm) marks.push({at:m.index,date:dm[1],time:dm[2]||''});
      else if(tm) marks.push({at:m.index,date:fileDate,time:tm[1]});
      else marks.push({at:m.index,date:fileDate,time:''});
    }
    var segs=[];
    if(!marks.length){ segs.push({date:fileDate,time:'',body:raw,bs:0,be:raw.length}); }
    else{
      if(marks[0].at>0) segs.push({date:fileDate,time:'',body:raw.slice(0,marks[0].at),bs:0,be:marks[0].at});
      for(var i=0;i<marks.length;i++){
        var end=(i+1<marks.length)?marks[i+1].at:raw.length;
        var lineEnd=raw.indexOf('\n',marks[i].at);
        var bodyStart=(lineEnd===-1||lineEnd>=end)?end:lineEnd+1;
        segs.push({date:marks[i].date,time:marks[i].time,body:raw.slice(bodyStart,end),bs:bodyStart,be:end});
      }
    }
    return segs;
  }
  // 时间补零：「9:5」→「09:05」；空值原样返回
  function normTime(t){
    var p=String(t||'').split(':');
    if(p.length!==2) return String(t||'');
    var h=p[0],m=p[1];
    if(h.length<2) h='0'+h;
    if(m.length<2) m='0'+m;
    return h+':'+m;
  }
  // 无分篇头时间时的兜底：文件名 _HHMMSS（日期对得上才用）→ 文件修改时间
  function fallbackTime(e, date){
    var fm=/^(\d{4}-\d{2}-\d{2})_(\d{2})(\d{2})/.exec(String(e.name||''));
    if(fm&&fm[1]===date) return fm[2]+':'+fm[3];
    return (e.updated_at||'').slice(11,16);
  }

  // 单张卡的 HTML（render 与就地更新共用）；bodyId 用于展开/收起与编辑定位
  function cardHtml(d, bodyId, kw, needClip){
    return '<div class="day-card'+(kw?' match':'')+(d.hidden?' diary-is-hidden':'')+'" data-rel="'+esc(d.relPath)+'" data-w="'+d._wid+'">'
      +'<div class="day-head"><span class="day-time">'+esc(d.time)+'</span>'
      +(d.src?'<span class="day-src">'+esc(d.src)+'</span>':'')
      +'<span class="diary-hidden-tag"'+(d.hidden?'':' style="display:none"')+'>已隐藏</span>'
      +'<span class="day-ops" style="margin-left:auto;display:inline-flex;gap:0.35rem;flex:none">'
      +'<button class="diary-edit-btn" data-w="'+d._wid+'">编辑</button>'
      +(d.vc?'<button class="diary-hist-btn" data-rel="'+esc(d.relPath)+'" data-w="'+d._wid+'">历史'+(d.vc>1?'·'+d.vc:'')+'</button>':'')
      +'<button class="diary-hide-btn" data-rel="'+esc(d.relPath)+'" data-w="'+d._wid+'" data-hidden="'+(d.hidden?'1':'0')+'">'+(d.hidden?'显示':'隐藏')+'</button>'
      +'</span>'
      +'</div>'
      +'<div class="day-body" id="'+bodyId+'">'+renderParas(needClip?clipText(d.text):d.text,kw)+'</div>'
      +(needClip?'<button class="expand-btn" data-for="'+bodyId+'">展开全文</button>':'')
      +'</div>';
  }
  // 就地更新某张卡的隐藏状态（不重建列表，折叠/滚动位置不动）
  function applyHiddenRel(rel, toHidden){
    writings.forEach(function(d){ if(d.relPath===rel) d.hidden=toHidden; });
    Array.prototype.forEach.call(document.querySelectorAll('#list .day-card[data-rel]'),function(card){
      if(card.getAttribute('data-rel')!==rel) return;
      card.classList.toggle('diary-is-hidden',toHidden);
      var tag=card.querySelector('.diary-hidden-tag'); if(tag) tag.style.display=toHidden?'':'none';
      var hb=card.querySelector('.diary-hide-btn'); if(hb){ hb.textContent=toHidden?'显示':'隐藏'; hb.setAttribute('data-hidden',toHidden?'1':'0'); hb.disabled=false; }
    });
  }
  // 把某张卡（按 _wid 定位）就地换回只读渲染；编辑保存后用
  function rerenderCard(d){
    var wid=String(d._wid);
    var idx=writings.indexOf(d);
    var kw=document.getElementById('searchInput').value.trim();
    Array.prototype.forEach.call(document.querySelectorAll('#list .day-card'),function(card){
      if(card.getAttribute('data-w')!==wid) return;
      var bodyId='db-r'+idx+'-'+wid;
      var needClip=!kw && d.text.length>EXCERPT_LEN;
      if(needClip) clipMap[bodyId]={text:d.text,expanded:false}; else delete clipMap[bodyId];
      var tmp=document.createElement('div');
      tmp.innerHTML=cardHtml(d,bodyId,kw,needClip);
      var fresh=tmp.firstChild;
      card.parentNode.replaceChild(fresh,card);
      bindCard(fresh);
    });
  }
  // 历史版本弹层：列表只取时间/字数，点「查看」才拉正文，点「恢复」写回（恢复前当前内容会先存为新版本）
  function openHistory(rel){
    fetch('/xie-diary/api/versions?relPath='+encodeURIComponent(rel),{headers:authHeaders()})
      .then(function(r){ if(r.status===401){ showKeyGate(); throw new Error('需要访问口令'); } return r.json(); })
      .then(function(j){ renderHistory(rel,(j&&j.versions)||[]); })
      .catch(function(e){ if(e.message!=='需要访问口令') alert('读取历史失败：'+e.message); });
  }
  function renderHistory(rel,vs){
    var mask=document.createElement('div'); mask.className='hist-mask';
    var box=document.createElement('div'); box.className='hist-modal';
    var html='<div class="hist-title">历史版本 · '+esc(rel)+'</div>';
    if(!vs.length) html+='<div style="font-size:0.75rem;color:#8a756a">还没有历史版本（编辑保存后会自动留下旧内容）</div>';
    vs.forEach(function(v,i){
      html+='<div class="hist-item" data-i="'+i+'">'
        +'<div class="hist-meta"><span>'+esc(v.time)+'</span><span>'+(v.chars||0)+' 字</span>'
        +'<span class="hist-ops"><button class="hist-btn hv">查看</button><button class="hist-btn hr">恢复</button></span>'
        +'</div></div>';
    });
    html+='<div style="margin-top:0.85rem;text-align:right"><button class="hist-btn" id="histClose">关闭</button></div>';
    box.innerHTML=html; mask.appendChild(box); document.body.appendChild(mask);
    function close(){ if(mask.parentNode) mask.parentNode.removeChild(mask); }
    mask.addEventListener('click',function(e){ if(e.target===mask) close(); });
    box.querySelector('#histClose').addEventListener('click',close);
    Array.prototype.forEach.call(box.querySelectorAll('.hist-item'),function(item){
      var i=+item.getAttribute('data-i'), v=vs[i];
      item.querySelector('.hv').addEventListener('click',function(){
        var ex=item.querySelector('.hist-body');
        if(ex){ ex.parentNode.removeChild(ex); item.querySelector('.hv').textContent='查看'; return; }
        item.querySelector('.hv').textContent='收起';
        var d=document.createElement('div'); d.className='hist-body'; d.textContent='（读取中…）';
        item.appendChild(d);
        fetch('/xie-diary/api/version?relPath='+encodeURIComponent(rel)+'&ts='+encodeURIComponent(v.ts),{headers:authHeaders()})
          .then(function(r){ return r.json(); })
          .then(function(j){ d.textContent=(j&&typeof j.content==='string')?j.content:'（读取失败）'; })
          .catch(function(){ d.textContent='（读取失败）'; });
      });
      item.querySelector('.hr').addEventListener('click',function(){
        var b=item.querySelector('.hr');
        if(!confirm('把这篇恢复到 '+v.time+' 的版本？\n当前内容会先存为一个新版本，不会丢。')) return;
        b.disabled=true; b.textContent='恢复中…';
        api('/xie-diary/api/restore',{relPath:rel,ts:v.ts})
          .then(function(j){
            if(j&&j.success){ close(); loadList(); }
            else { b.disabled=false; b.textContent='恢复'; alert('恢复失败：'+((j&&j.error)||'未知错误')); }
          })
          .catch(function(e){ b.disabled=false; b.textContent='恢复'; if(e.message!=='需要访问口令') alert('恢复失败：'+e.message); });
      });
    });
  }
  // 给一张卡（或整个列表容器）绑交互：隐藏/编辑/展开/历史
  function bindCard(root){
    Array.prototype.forEach.call(root.querySelectorAll('.group-head'),function(head){
      head.addEventListener('click',function(){ head.parentNode.classList.toggle('open'); });
    });
    // 隐藏/恢复按文件粒度（隐藏=不注入给 AI、工具 diary_view 也检索不到）：同一文件拆出的多张卡共用一个状态
    Array.prototype.forEach.call(root.querySelectorAll('.diary-hide-btn'),function(btn){
      btn.addEventListener('click',function(){
        var rel=btn.getAttribute('data-rel');
        var toHidden=btn.getAttribute('data-hidden')!=='1';
        btn.disabled=true;
        api('/xie-diary/api/hide',{relPath:rel,hidden:toHidden})
          .then(function(j){
            if(j&&j.success){ applyHiddenRel(rel,toHidden); }   // 就地更新，不重建列表
            else { alert('操作失败：'+((j&&j.error)||'未知错误')); btn.disabled=false; }
          })
          .catch(function(e){ if(e.message!=='需要访问口令') alert('操作失败：'+e.message); btn.disabled=false; });
      });
    });
    // 编辑：卡内正文换 textarea，保存=重建整份文件内容（只替换本篇段落，篇头与同文件其它篇不动）
    Array.prototype.forEach.call(root.querySelectorAll('.diary-edit-btn'),function(btn){
      btn.addEventListener('click',function(){
        var wid=btn.getAttribute('data-w');
        // 按 _wid 精确查找：删除会用 filter 重建数组，按下标取会错位打开别的篇
        var d=null;
        Array.prototype.forEach.call(writings,function(o){ if(!d && String(o._wid)===String(wid)) d=o; });
        if(!d) return;
        var card=btn.closest('.day-card');
        var body=card.querySelector('.day-body');
        var expand=card.querySelector('.expand-btn');
        if(expand) expand.style.display='none';
        btn.disabled=true;
        body.innerHTML='<textarea class="diary-edit-ta" style="width:100%;min-height:9em;border:1px solid rgba(181,131,122,0.35);border-radius:10px;padding:0.6rem;font-family:inherit;font-size:0.8rem;line-height:1.8;color:#6a584a;background:rgba(255,255,255,0.8);outline:none;resize:vertical">'+esc(d.text)+'</textarea>'
          +'<div style="display:flex;gap:0.5rem;margin-top:0.45rem">'
          +'<button class="diary-save-btn" style="border:none;border-radius:10px;background:#b5837a;color:#fff;font-family:inherit;font-size:0.68rem;letter-spacing:2px;padding:0.25rem 0.9rem;cursor:pointer">保存</button>'
          +'<button class="diary-cancel-btn" style="border:1px solid rgba(181,131,122,0.35);border-radius:10px;background:none;color:#b5837a;font-family:inherit;font-size:0.68rem;letter-spacing:2px;padding:0.25rem 0.9rem;cursor:pointer">取消</button>'
          +'<span class="diary-edit-msg" style="font-size:0.62rem;color:#c08080;letter-spacing:1px;align-self:center"></span>'
          +'</div>';
        var ta=body.querySelector('.diary-edit-ta');
        ta.style.height=Math.max(9*1.2, ta.scrollHeight/16)+'em';
        body.querySelector('.diary-cancel-btn').addEventListener('click',function(){
          var needClip=d.text.length>EXCERPT_LEN;
          body.innerHTML=renderParas(needClip?clipText(d.text):d.text,'');
          if(expand){ expand.style.display=''; }
          btn.disabled=false;
        });
        body.querySelector('.diary-save-btn').addEventListener('click',function(){
          var newText=ta.value.replace(/\s+$/,'');
          if(!newText.trim()){ alert('正文不能为空'); return; }
          var newRaw=d._raw.slice(0,d._bs)+newText+d._raw.slice(d._be);
          var sb=body.querySelector('.diary-save-btn'), msg=body.querySelector('.diary-edit-msg');
          sb.disabled=true; msg.textContent='保存中…';
          api('/xie-diary/api/update',{relPath:d.relPath,content:newRaw})
            .then(function(j){
              if(j&&j.success){
                var delta=newText.length-(d._be-d._bs);
                d.text=newText; d._raw=newRaw; d._be+=delta; d.vc=(d.vc||0)+1;
                // 同文件其它篇的偏移跟着平移
                writings.forEach(function(o){ if(o!==d&&o.relPath===d.relPath){ if(o._bs>=d._be-delta) { o._bs+=delta; o._be+=delta; } } });
                msg.textContent='';
                rerenderCard(d);
              } else { sb.disabled=false; msg.textContent='保存失败：'+((j&&j.error)||'未知错误'); }
            })
            .catch(function(e){ sb.disabled=false; msg.textContent=(e.message==='需要访问口令')?'':('保存失败：'+e.message); if(e.message==='需要访问口令') showKeyGate(); });
        });
      });
    });
    // 历史版本（2026-10-02）：点开列出该篇历次编辑前的旧内容，可查看 / 恢复
    Array.prototype.forEach.call(root.querySelectorAll('.diary-hist-btn'),function(btn){
      btn.addEventListener('click',function(){ openHistory(btn.getAttribute('data-rel')); });
    });
    // 展开/收起：截断文本与全文整段重渲染
    Array.prototype.forEach.call(root.querySelectorAll('.expand-btn'),function(btn){
      btn.addEventListener('click',function(){
        var st=clipMap[btn.getAttribute('data-for')];
        var body=document.getElementById(btn.getAttribute('data-for'));
        if(!st||!body) return;
        st.expanded=!st.expanded;
        body.innerHTML=renderParas(st.expanded?st.text:clipText(st.text),'');
        btn.textContent=st.expanded?'收起':'展开全文';
      });
    });
  }
  var clipMap={};   // bodyId -> {text, expanded}：截断卡片的展开/收起状态（模块级，rerenderCard 复用）
  function render(kw){
    var list=document.getElementById('list');
    var meta=document.getElementById('metaLine');
    kw=String(kw||'').trim();
    var shown=writings;
    if(kw){
      var k=kw.toLowerCase();
      shown=writings.filter(function(d){
        return d.date.indexOf(kw)!==-1 || d.time.indexOf(kw)!==-1 || d.src.toLowerCase().indexOf(k)!==-1 || d.text.toLowerCase().indexOf(k)!==-1;
      });
    }
    if(!writings.length){ list.innerHTML='<div class="empty">日记本还是空的</div>'; meta.textContent=''; return; }
    if(!shown.length){ list.innerHTML='<div class="empty">没有匹配「'+esc(kw)+'」的日记</div>'; meta.textContent='0 篇 · 搜索中'; return; }
    meta.textContent=(kw?('匹配 '+shown.length+' 篇 · '):('共 '+writings.length+' 篇 · '))+'最新 '+shown[0].date;
    // 按天分组：日期作组头，点组头展开/收起；默认全部收起，搜索时全展开
    var groups=[];
    shown.forEach(function(d){
      var g=groups[groups.length-1];
      if(!g||g.date!==d.date){ g={date:d.date,items:[]}; groups.push(g); }
      g.items.push(d);
    });
    clipMap={};
    list.innerHTML=groups.map(function(g,gi){
      var cards=g.items.map(function(d,i){
        var bodyId='db'+gi+'-'+i;
        var needClip=!kw && d.text.length>EXCERPT_LEN;
        if(needClip) clipMap[bodyId]={text:d.text,expanded:false};
        return cardHtml(d,bodyId,kw,needClip);
      }).join('');
      return '<div class="day-group'+(kw?' open':'')+'">'
        +'<div class="group-head" data-g="'+gi+'"><span class="g-date">'+esc(g.date)+'</span>'
        +'<span class="g-count">'+g.items.length+' 篇</span>'
        +'<svg class="g-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>'
        +'</div>'
        +'<div class="group-body">'+cards+'</div>'
        +'</div>';
    }).join('');
    bindCard(list);
  }

  function loadList(){
    fetch(API,{headers:authHeaders()}).then(function(r){
      if(r.status===401){ showKeyGate(); throw new Error('需要访问口令'); }
      return r.json();
    }).then(function(j){
    var files=(j&&j.entries)||[];
    // 每次书写一卡：文件按「##」分篇头拆开（旧的一天多篇文件也拆），时间取各篇头行，
    // 取不到时退回文件名 _HHMMSS，再退回文件修改时间；空段丢弃；完全按时间倒序。
    writings=[];
    files.forEach(function(e){
      var src=e.session?('窗口 '+e.session):'';
      var rel=e.relPath||e.name;
      var hidden=!!e.hidden;
      var raw=String(e.content||'').replace(/\r\n/g,'\n').trim();
      splitWritings(e).forEach(function(s){
        var text=String(s.body||'').trim();
        if(!text) return;
        writings.push({
          date:s.date,
          time:normTime(s.time)||fallbackTime(e,s.date),
          src:src,
          text:text,
          relPath:rel,
          hidden:hidden,
          _wid:writings.length,
          _raw:raw,
          _bs:s.bs,
          _be:s.be,
          vc:e.vc||0
        });
      });
    });
    writings.sort(function(a,b){
      if(a.date!==b.date) return a.date<b.date?1:-1;
      var ka=a.date+' '+a.time, kb=b.date+' '+b.time;
      return ka<kb?1:-1;
    });
    render('');
  }).catch(function(e){
    if(e.message!=='需要访问口令') document.getElementById('list').innerHTML='<div class="empty">加载失败：'+esc(e.message)+'</div>';
  });
  }
  loadList();

  // 口令门：解锁后记住（localStorage），重拉列表
  document.getElementById('keySave').addEventListener('click',function(){
    var v=document.getElementById('keyInput').value.trim();
    var msg=document.getElementById('keyMsg');
    if(!v){ msg.textContent='请输入口令'; return; }
    localStorage.setItem('xie_diary_key',v);
    msg.textContent='验证中…';
    fetch(API,{headers:authHeaders()}).then(function(r){
      if(r.status===401){ msg.textContent='口令不对，再试试'; localStorage.removeItem('xie_diary_key'); return null; }
      document.getElementById('keyGate').style.display='none';
      loadList();
    }).catch(function(){ msg.textContent='网络错误'; });
  });
  document.getElementById('keyInput').addEventListener('keydown',function(ev){
    if(ev.key==='Enter') document.getElementById('keySave').click();
  });

  var timer=null;
  document.getElementById('searchInput').addEventListener('input',function(ev){
    clearTimeout(timer);
    var v=ev.target.value;
    timer=setTimeout(function(){ render(v); },120);
  });
})();
</script>
</body>
</html>
