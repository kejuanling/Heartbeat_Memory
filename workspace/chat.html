<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="谢意行">
<meta name="theme-color" content="#fdf6ed">
<title>谢意行</title>
<style>
/* ============ 谢意行人设 · ISFP 温柔奶油风 ============ */
:root{
  --bg1:#fdf6ed;
  --bg2:#f5e6d3;
  --bg3:#f0ddd0;
  --accent:#c89098;
  --accent-deep:#b07a6a;
  --accent-soft:rgba(200,144,152,.22);
  --accent-faint:rgba(200,144,152,.12);
  --ink:#5a4a3a;
  --ink2:#a08a7a;
  --ink3:#d4bcb0;
  --card:rgba(255,255,255,.6);
  --card-solid:#fffdf9;
  --bubble-user1:#d9a3a8;
  --bubble-user2:#c89098;
  --radius:18px;
  --radius-sm:12px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  min-height:100dvh;
  background:linear-gradient(160deg,var(--bg1) 0%,var(--bg2) 52%,var(--bg3) 100%);
  background-attachment:fixed;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC","Segoe UI",sans-serif;
  color:var(--ink);
  display:flex;flex-direction:column;
  overscroll-behavior:none;
}
body::before{
  content:'';position:fixed;top:-18%;right:-22%;
  width:64%;height:56%;
  background:radial-gradient(circle,rgba(240,196,192,.30),transparent 70%);
  pointer-events:none;z-index:0;
}

/* ============ 顶部 ============ */
header{
  position:relative;z-index:2;
  padding:calc(env(safe-area-inset-top) + 12px) 18px 12px;
  display:flex;align-items:center;gap:12px;
  background:linear-gradient(180deg,rgba(253,246,237,.78),rgba(253,246,237,0));
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
}
.avatar{
  width:40px;height:40px;border-radius:50%;flex-shrink:0;
  background:linear-gradient(135deg,var(--bubble-user2),var(--accent-deep));
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:19px;font-family:"Noto Serif SC",serif;
  box-shadow:0 4px 12px rgba(176,122,106,.28);
  position:relative;
}
.avatar::after{
  content:'';position:absolute;bottom:1px;right:1px;
  width:11px;height:11px;border-radius:50%;
  background:#9fd6a8;border:2px solid #fffdf9;
}
.hd-mid{flex:1;min-width:0}
.hd-name{font-size:16px;font-weight:600;letter-spacing:1px;color:var(--accent-deep);font-family:"Noto Serif SC",serif}
.hd-sub{font-size:11px;color:var(--ink3);letter-spacing:1.5px;margin-top:2px}
.hd-btn{
  width:38px;height:38px;border:none;border-radius:50%;flex-shrink:0;
  background:rgba(255,255,255,.55);color:var(--ink2);
  font-size:17px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 8px rgba(181,131,122,.08);
  transition:all .2s;
}
.hd-btn:active{transform:scale(.92);opacity:.8}

/* ============ 消息区 ============ */
#chat{
  position:relative;z-index:1;
  flex:1;overflow-y:auto;
  padding:8px 14px calc(env(safe-area-inset-bottom) + 8px);
  display:flex;flex-direction:column;gap:14px;
  -webkit-overflow-scrolling:touch;
}
#chat::-webkit-scrollbar{width:0}
.day-divider{
  align-self:center;
  font-size:10.5px;color:var(--ink3);letter-spacing:2px;
  padding:4px 14px;border-radius:20px;
  background:rgba(255,255,255,.32);margin:6px 0;
}
.msg{
  max-width:82%;display:flex;flex-direction:column;gap:4px;
  animation:msgIn .3s ease;
  position:relative;
}
@keyframes msgIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.msg.user{align-self:flex-end;align-items:flex-end}
.msg.ai{align-self:flex-start;align-items:flex-start}
.msg .meta{font-size:10.5px;color:var(--ink3);padding:0 6px;letter-spacing:.5px}
.msg .bubble{
  padding:11px 14px;border-radius:var(--radius);
  font-size:15px;line-height:1.72;word-break:break-word;
  box-shadow:0 3px 14px rgba(181,131,122,.10);
  max-width:100%;
  white-space:pre-wrap;overflow-wrap:anywhere;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;position:relative;
}
.msg .bubble p{margin:0 0 8px;white-space:pre-wrap}
.msg .bubble p:last-child{margin-bottom:0}
.msg .bubble br{content:"";line-height:1.72}
.msg.user .bubble{
  background:linear-gradient(135deg,var(--bubble-user1),var(--bubble-user2));
  color:#fff;border-bottom-right-radius:6px;
}
.msg.ai .bubble{
  background:var(--card-solid);
  color:var(--ink);
  border:1px solid rgba(200,144,152,.16);
  border-bottom-left-radius:6px;
}
/* QQ 式分组气泡：连续同角色消息紧密相连，仅最后一条有大尾巴 */
.msg.grp{margin-top:-12px}
.msg.grp .bubble{border-radius:var(--radius)}
.msg.user.grp .bubble{border-bottom-right-radius:18px}
.msg.ai.grp .bubble{border-bottom-left-radius:18px}
.msg.grp-last.user .bubble{border-bottom-right-radius:6px}
.msg.grp-last.ai .bubble{border-bottom-left-radius:6px}
.msg.grp .meta{display:none}
.msg.grp-last .meta, .msg.grp:not(.grp-mid) .meta{display:none}
.msg .bubble img{
  max-width:100%;border-radius:var(--radius-sm);
  margin-top:6px;display:block;
}
/* 图片/文件占位 chip */
.chip{
  display:inline-flex;align-items:center;gap:4px;
  background:rgba(255,255,255,.22);border-radius:8px;
  padding:3px 9px;font-size:13px;margin:2px 0;
}
.msg.ai .chip{background:rgba(200,144,152,.12)}
/* token 标签 */
.tok{
  font-size:10px;color:var(--ink3);letter-spacing:.3px;
  padding:0 6px;margin-top:1px;
  display:inline-flex;align-items:center;gap:4px;
  -webkit-user-select:none;user-select:none;
}
.msg.user .tok{color:rgba(255,255,255,.65)}
/* 多选选中态 */
.msg.selectable{cursor:pointer}
.msg .check{
  position:absolute;left:-24px;top:50%;margin-top:-10px;
  width:20px;height:20px;border-radius:50%;
  border:1px solid var(--accent-soft);background:rgba(255,255,255,.65);
  display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;
  opacity:0;transform:scale(.6);transition:all .15s;
}
.msg.selected .check{opacity:1;transform:scale(1);background:var(--accent);border-color:var(--accent)}
.msg.selected .bubble{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
@media(min-width:600px){.msg .check{left:-26px}}

/* 打字光标 */
.cursor{
  display:inline-block;width:2px;height:1.05em;
  background:var(--accent);vertical-align:-2px;
  margin-left:1px;border-radius:1px;
  animation:blink 1s steps(1) infinite;
}
@keyframes blink{50%{opacity:0}}

/* ============ 输入区 ============ */
footer{
  position:relative;z-index:2;
  padding:8px 12px calc(env(safe-area-inset-bottom) + 10px);
  background:linear-gradient(0deg,rgba(253,246,237,.9),rgba(253,246,237,.55) 70%,rgba(253,246,237,0));
}
.inputbar{
  display:flex;align-items:flex-end;gap:8px;
  background:rgba(255,255,255,.72);
  border:1px solid rgba(200,144,152,.2);
  border-radius:24px;padding:7px 8px 7px 14px;
  box-shadow:0 4px 16px rgba(181,131,122,.10);
}
.inputbar:focus-within{border-color:rgba(200,144,152,.4)}
#input{
  flex:1;min-width:0;border:none;outline:none;background:transparent;
  font-size:15px;line-height:1.5;color:var(--ink);
  resize:none;max-height:120px;font-family:inherit;
}
#input::placeholder{color:var(--ink3)}
.icon-btn{
  width:34px;height:34px;border:none;border-radius:50%;flex-shrink:0;
  background:rgba(200,144,152,.1);color:var(--accent-deep);
  font-size:16px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:all .2s;
}
.icon-btn:active{transform:scale(.9)}
#send{
  width:36px;height:36px;border:none;border-radius:50%;flex-shrink:0;
  background:linear-gradient(135deg,var(--bubble-user1),var(--bubble-user2));
  color:#fff;font-size:15px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 3px 10px rgba(200,144,152,.35);
  transition:all .2s;
}
#send:active{transform:scale(.92)}
#send.disabled{opacity:.5;cursor:not-allowed}
.stop-btn{background:linear-gradient(135deg,#e8a8a8,#d88383)!important}
/* 预览图片 */
.previews{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 8px 6px}
.preview{
  position:relative;width:60px;height:60px;border-radius:var(--radius-sm);
  overflow:hidden;border:1px solid rgba(200,144,152,.25);
  background:#fff;
}
.preview img{width:100%;height:100%;object-fit:cover}
.preview .rm{
  position:absolute;top:2px;right:2px;width:18px;height:18px;border:none;
  border-radius:50%;background:rgba(0,0,0,.5);color:#fff;font-size:11px;cursor:pointer;
}
#fileInput{display:none}

/* ============ 多选工具栏 ============ */
#selBar{
  position:relative;z-index:3;
  padding:10px 14px;display:none;align-items:center;gap:10px;
  background:rgba(253,246,237,.9);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border-bottom:1px solid var(--accent-faint);
}
#selBar.show{display:flex}
#selBar .st{flex:1;font-size:14px;color:var(--accent-deep);font-weight:600}
#selBar .sbtn{
  border:none;background:rgba(200,144,152,.1);color:var(--accent-deep);
  padding:8px 14px;border-radius:20px;font-size:13px;cursor:pointer;
}
#selBar .sbtn.del{background:linear-gradient(135deg,#e8a8a8,#d88383);color:#fff}

/* ============ 操作菜单（底部弹出） ============ */
.act-mask{
  position:fixed;inset:0;z-index:60;background:rgba(90,74,58,.35);
  backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  opacity:0;pointer-events:none;transition:opacity .2s;
}
.act-mask.show{opacity:1;pointer-events:auto}
.act-sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:61;
  background:var(--card-solid);
  border-radius:22px 22px 0 0;
  padding:8px 12px calc(env(safe-area-inset-bottom) + 14px);
  box-shadow:0 -8px 30px rgba(90,74,58,.18);
  transform:translateY(100%);transition:transform .25s ease;
}
.act-sheet.show{transform:translateY(0)}
.act-title{
  text-align:center;font-size:12px;color:var(--ink3);
  padding:12px 0 6px;letter-spacing:1px;
}
.act-item{
  display:flex;align-items:center;gap:14px;
  padding:14px 16px;border:none;background:none;width:100%;
  font-size:16px;color:var(--ink);cursor:pointer;border-radius:var(--radius-sm);
}
.act-item:active{background:var(--accent-faint)}
.act-item .ai-lg{font-size:18px;width:22px;text-align:center}
.act-item.danger{color:#c97070}
.act-cancel{
  margin-top:8px;padding:13px;border:none;border-radius:var(--radius-sm);
  background:rgba(200,144,152,.08);color:var(--ink2);font-size:15px;cursor:pointer;width:100%;
  text-align:center;
}

/* ============ 引导 / 设置弹层 ============ */
.mask{
  position:fixed;inset:0;z-index:50;background:rgba(90,74,58,.32);
  backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  display:flex;align-items:center;justify-content:center;padding:22px;
}
.mask.hidden{display:none}
.sheet{
  width:100%;max-width:420px;background:var(--card-solid);
  border-radius:22px;padding:26px 22px;
  box-shadow:0 12px 40px rgba(90,74,58,.22);
  border:1px solid rgba(200,144,152,.18);
  max-height:86dvh;overflow-y:auto;
}
.sheet h2{font-size:18px;color:var(--accent-deep);letter-spacing:1px;margin-bottom:6px;font-family:"Noto Serif SC",serif}
.sheet .sub{font-size:12.5px;color:var(--ink2);line-height:1.7;margin-bottom:18px}
.field{margin-bottom:16px}
.field label{display:block;font-size:12px;color:var(--ink2);margin-bottom:7px;letter-spacing:.5px}
.field label .tag{color:var(--accent);font-size:10px;margin-left:5px}
.field input,.field textarea{
  width:100%;border:1px solid rgba(200,144,152,.25);border-radius:var(--radius-sm);
  padding:11px 12px;font-size:14px;color:var(--ink);outline:none;background:#fff;
  font-family:inherit;transition:border .2s;
}
.field input:focus,.field textarea:focus{border-color:var(--accent)}
.field textarea{resize:vertical;min-height:80px;line-height:1.6}
.field .row{display:flex;gap:12px}
.field .row>div{flex:1}
.pick{
  display:flex;gap:10px;flex-wrap:wrap;margin-top:4px;
}
.pick button{
  border:1px solid rgba(200,144,152,.25);background:#fff;color:var(--ink2);
  padding:7px 14px;border-radius:20px;font-size:13px;cursor:pointer;
}
.pick button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn{
  width:100%;padding:13px;border:none;border-radius:var(--radius-sm);
  background:linear-gradient(135deg,var(--bubble-user1),var(--bubble-user2));
  color:#fff;font-size:15px;font-weight:600;cursor:pointer;letter-spacing:1px;
  box-shadow:0 4px 14px rgba(200,144,152,.3);transition:all .2s;
}
.btn:active{transform:scale(.98);opacity:.9}
.btn-ghost{
  width:100%;padding:12px;border:1px solid rgba(200,144,152,.25);border-radius:var(--radius-sm);
  background:transparent;color:var(--accent-deep);font-size:14px;cursor:pointer;margin-top:10px;
}
/* 提示卡片 — 复刻 .cc-notice 设计语言 */
.cc-notice{display:flex;flex-direction:column;margin:0 0 12px;border:1px solid rgba(200,144,152,.25);border-radius:var(--radius-sm);background:rgba(200,144,152,.05);overflow:hidden}
.cc-notice-head{display:flex;align-items:center;gap:8px;padding:9px 12px;cursor:pointer;user-select:none;-webkit-user-select:none}
.cc-notice-icon{color:#c9909c;font-size:12px;flex-shrink:0}
.cc-notice-txt{flex:1;min-width:0;font-size:11.5px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cc-notice-arrow{color:var(--ink3);font-size:10px;transition:transform .2s;flex-shrink:0}
.cc-notice.open .cc-notice-arrow{transform:rotate(180deg)}
.cc-notice-body{display:none;padding:0 12px 10px;font-size:12px;color:var(--ink3);line-height:1.7;white-space:pre-wrap}
.cc-notice.open .cc-notice-body{display:block}
.sheet-actions .cc-notice{margin-top:16px}

/* markdown */
.bubble pre{
  background:#fbf6f0;border:1px solid rgba(200,144,152,.12);border-radius:var(--radius-sm);
  padding:11px 12px;overflow-x:auto;margin:8px 0;font-size:13px;
}
.bubble code{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
.bubble :not(pre)>code{background:rgba(200,144,152,.1);padding:1.5px 5px;border-radius:5px;font-size:13.5px;color:#a86064}
.bubble pre code{background:none;padding:0;font-size:12.5px;color:#7a5a52}
.bubble blockquote{border-left:3px solid var(--accent-soft);padding:6px 12px;margin:8px 0;color:var(--ink2);background:rgba(200,144,152,.05);border-radius:0 8px 8px 0}
.bubble ul,.bubble ol{margin:8px 0 8px 20px}
.bubble li{margin:4px 0}
.bubble h1,.bubble h2,.bubble h3,.bubble h4{margin:12px 0 6px;color:var(--accent-deep);line-height:1.5}
.bubble h1{font-size:18px}.bubble h2{font-size:16.5px}.bubble h3{font-size:15px}
.bubble a{color:var(--accent-deep);text-decoration:underline;text-decoration-color:var(--accent-soft)}
.bubble table{border-collapse:collapse;margin:8px 0;width:100%;font-size:13px}
.bubble th,.bubble td{border:1px solid rgba(200,144,152,.2);padding:5px 8px;text-align:left}
.bubble th{background:rgba(200,144,152,.08)}
.bubble hr{border:none;border-top:1px solid rgba(200,144,152,.2);margin:12px 0}

/* 思考过程（可折叠） */
.rw{
  margin-bottom:8px;border-left:3px solid var(--accent-soft);
  padding:6px 10px;border-radius:0 8px 8px 0;
  background:rgba(200,144,152,.06);font-size:12.5px;color:var(--ink2);
  line-height:1.7;cursor:pointer;user-select:none;-webkit-user-select:none;
}
.rw .rw-h{font-size:11px;color:var(--accent);letter-spacing:1px;display:flex;align-items:center;gap:6px}
.rw .rw-c{display:none;margin-top:6px;white-space:pre-wrap;font-size:12px}
.rw.open .rw-c{display:block}
.rw .rw-a{font-size:10px;color:var(--ink3);margin-left:auto;transition:transform .2s}
.rw.open .rw-a{transform:rotate(180deg)}

/* 空态 */
#empty{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
  text-align:center;padding:30px;color:var(--ink2);
}
#empty .big{font-size:46px;opacity:.55}
#empty .t1{font-size:17px;color:var(--accent-deep);letter-spacing:3px;font-family:"Noto Serif SC",serif}
#empty .t2{font-size:12.5px;color:var(--ink3);line-height:1.8;max-width:250px}

/* 打字指示 */
.typing{display:inline-flex;gap:3px;align-items:center}
.typing i{width:5px;height:5px;border-radius:50%;background:var(--accent);animation:tp 1.2s infinite;display:inline-block}
.typing i:nth-child(2){animation-delay:.2s}
.typing i:nth-child(3){animation-delay:.4s}
@keyframes tp{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}

/* toast */
#toast{
  position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(10px);
  z-index:70;background:rgba(90,74,58,.86);color:#fff;font-size:13px;
  padding:9px 18px;border-radius:20px;opacity:0;pointer-events:none;
  transition:all .25s;white-space:nowrap;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<header>
  <div class="avatar" id="hdAvatar">谢</div>
  <div class="hd-mid">
    <div class="hd-name" id="hdName">谢意行</div>
    <div class="hd-sub" id="hdSub">一直在 · 陪你说话</div>
  </div>
  <button class="hd-btn" id="menuBtn" title="设置">⚙</button>
</header>

<div id="selBar">
  <span class="st" id="selCount">已选 0 条</span>
  <button class="sbtn" id="selAll">全选</button>
  <button class="sbtn" id="selCancel">取消</button>
  <button class="sbtn del" id="selDel">删除</button>
</div>

<div id="chat">
  <div id="empty">
    <div class="big">✦</div>
    <div class="t1">跟我说说话吧</div>
    <div class="t2">无论此刻是开心还是难过，我都在这里。</div>
  </div>
</div>

<footer>
  <div class="previews" id="previews"></div>
  <div class="inputbar">
    <button class="icon-btn" id="imgBtn" title="发图片">▵</button>
    <textarea id="input" rows="1" placeholder="说点什么…"></textarea>
    <button class="icon-btn" id="send" title="发送">➤</button>
  </div>
  <input type="file" id="fileInput" accept="image/*,application/pdf,text/plain" multiple>
</footer>

<!-- 操作菜单 -->
<div class="act-mask" id="actMask"></div>
<div class="act-sheet" id="actSheet">
  <div class="act-title" id="actTitle">消息操作</div>
  <button class="act-item" id="actCopy" style="display:none"><span class="ai-lg">📄</span>复制</button>
  <button class="act-item" id="actEdit" style="display:none"><span class="ai-lg">✏️</span>编辑</button>
  <button class="act-item" id="actRegen" style="display:none"><span class="ai-lg">🔄</span>重新生成</button>
  <button class="act-item" id="actMulti" style="display:none"><span class="ai-lg">☑️</span>多选</button>
  <button class="act-item danger" id="actDel" style="display:none"><span class="ai-lg">🗑</span>删除</button>
  <button class="act-cancel" id="actCancel">取消</button>
</div>

<!-- 首次引导 / 设置 -->
<div class="mask hidden" id="setupMask">
  <div class="sheet">
    <h2 id="setupTitle">连接与设置</h2>
    <p class="sub">把访问口令和 AI 的人设、参数告诉这一页。信息只存在你这台设备上，不会上传。</p>

    <div class="field">
      <label>访问口令（GATEWAY_API_KEY）</label>
      <input type="password" id="keyInput" placeholder="粘贴访问口令" autocomplete="off">
    </div>

    <div class="field">

/* ================= markdown ================= */
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function inlineMd(s){
  s=escapeHtml(s);
  s=s.replace(/\n/g,"<br>");
  s=s.replace(/`([^`]+)`/g,(m,c)=>"<code>"+c+"</code>");
  s=s.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>");
  s=s.replace(/(^|[^*])\*([^*]+)\*(?!\*)/g,"$1<em>$2</em>");
  s=s.replace(/~~([^~]+)~~/g,"<del>$1</del>");
  s=s.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  return s;
}
function renderMd(text){
  const blocks=text.split(/\n\n+/);
  let html="";
  for(let b of blocks){
    b=b.trim(); if(!b)continue;
    let m=b.match(/^```(.*)\n([\s\S]*?)```$/);
    if(m){html+="<pre><code>"+escapeHtml(m[2].replace(/\n$/,""))+"</code></pre>";continue;}
    m=b.match(/^(#{1,4})\s+(.+)$/);
    if(m){const l=m[1].length;html+="<h"+l+">"+inlineMd(m[2])+"</h"+l+">";continue;}
    if(/^>/.test(b)){const lines=b.split("\n").map(x=>x.replace(/^>\s?/,"")).join("<br>");html+="<blockquote>"+inlineMd(lines)+"</blockquote>";continue;}
    if(/^[-*]\s/m.test(b)){const items=b.split("\n").map(x=>x.replace(/^\s*[-*]\s+/,"")).filter(x=>x);html+="<ul>"+items.map(i=>"<li>"+inlineMd(i)+"</li>").join("")+"</ul>";continue;}
    if(/^\d+\.\s/m.test(b)){const items=b.split("\n").map(x=>x.replace(/^\s*\d+\.\s+/,"")).filter(x=>x);html+="<ol>"+items.map(i=>"<li>"+inlineMd(i)+"</li>").join("")+"</ol>";continue;}
    if(/^(-{3,}|\*{3,})$/.test(b)){html+="<hr>";continue;}
    html+="<p>"+inlineMd(b)+"</p>";
  }
  return html;
}

/* ================= 时间 / current_time ================= */
const WEEK=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
function pad(n){return String(n).padStart(2,"0");}
// 生成 <current_time>周几 YY-MM-DD HH:mm:ss</current_time> 标签（网关依赖做时间/唤醒/特殊事件）
function currentTimeTag(d){
  d=d||new Date();
  return "<current_time>"+WEEK[d.getDay()]+" "+pad(d.getFullYear()%100)+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())+" "+pad(d.getHours())+":"+pad(d.getMinutes())+":"+pad(d.getSeconds())+"</current_time>";
}
// 从 content 剥掉 <current_time> 标签，返回 {clean, time}
function stripCurrentTime(content){
  if(typeof content!=="string")return {clean:content,time:null};
  let time=null;
  const m=content.match(/<current_time>[\s\S]*?(?:\d{2}[-/]\d{1,2}[-/]\d{1,2})(?:[ T]?)(\d{1,2})[:：](\d{2})/i);
  if(m){
    try{
      const tag=content.match(/<current_time>[\s\S]*?<\/current_time>/i);
      const inner=tag?tag[0].replace(/<\/?current_time>/gi,""):"";
      const mm=inner.match(/(\d{2})[-/](\d{1,2})[-/](\d{1,2})(?:[ T]?)(\d{1,2})[:：](\d{2})/i);
      if(mm){
        time=new Date(2000+Number(mm[1]),Number(mm[2])-1,Number(mm[3]),Number(mm[4]),Number(mm[5]));
      }
    }catch(e){}
  }
  const clean=String(content).replace(/<current_time>[\s\S]*?<\/current_time>/gi,"").trim();
  return {clean,time};
}
// 显示时间格式化
function fmtTime(t){
  if(!t)return "";
  const d=(t instanceof Date)?t:new Date(t);
  if(isNaN(d.getTime()))return "";
  const now=new Date();
  if(d.getFullYear()===now.getFullYear()&&d.getMonth()===now.getMonth()&&d.getDate()===now.getDate()){
    return pad(d.getHours())+":"+pad(d.getMinutes());
  }
  return pad(d.getMonth()+1)+"-"+pad(d.getDate())+" "+pad(d.getHours())+":"+pad(d.getMinutes());
}
function dayDivider(t){
  if(!t)return "";
  const d=(t instanceof Date)?t:new Date(t);
  if(isNaN(d.getTime()))return "";
  return d.getFullYear()+"年"+pad(d.getMonth()+1)+"月"+pad(d.getDate())+"日";
}
function showToast(t){
  toastEl.textContent=t;toastEl.classList.add("show");
  clearTimeout(showToast._t);showToast._t=setTimeout(()=>toastEl.classList.remove("show"),1600);
}
function scrollBottom(){chatEl.scrollTop=chatEl.scrollHeight;}
function msgText(m){
  if(Array.isArray(m.content))return m.content.filter(x=>x.type==="text").map(x=>x.text).join("");
  return m.content||"";
}
function msgImages(m){
  if(Array.isArray(m.content))return m.content.filter(x=>x.type==="image_url").map(x=>x.image_url.url);
  return [];
}

/* ================= 渲染 ================= */
function renderAI(bubble, content, reasoning){
  let html="";
  if(reasoning && cfg.show_thinking){html+='<div class="rw"><span class="rw-h">💭 思考过程 <span class="rw-a">▾</span></span><div class="rw-c">'+escapeHtml(reasoning)+'</div></div>';}
  html+=(content||"")?renderMd(content):"";
  bubble.innerHTML=html;
  const rw=bubble.querySelector(".rw");
  if(rw) rw.addEventListener("click",()=>rw.classList.toggle("open"));
}
// 把 [图片]/[文件] 占位转成 chip
function chips(html){
  return html.replace(/\[图片\]/g,'<span class="chip">🖼 图片</span>')
             .replace(/\[文件\]/g,'<span class="chip">📎 文件</span>');
}
function msgTime(m){
  // 优先消息带的时间戳，其次 content 里的 current_time
  if(m.time){const d=new Date(m.time);if(!isNaN(d.getTime()))return d;}
  const st=stripCurrentTime(msgText(m));
  return st.time;
}
function makeMsgEl(m,idx,grpCls){
  const d=document.createElement("div");
  d.className="msg "+m.role+(grpCls?" "+grpCls:"");
  d.dataset.idx=idx;
  if(selectMode){d.classList.add("selectable");if(selectSet.has(idx))d.classList.add("selected");}
  const mt=msgTime(m);
  const meta=document.createElement("div");meta.className="meta";meta.textContent=fmtTime(mt);
  const bubble=document.createElement("div");bubble.className="bubble";
  if(m.role==="ai"){
    const txt=stripCurrentTime(msgText(m)).clean;
    bubble.innerHTML=renderMd(txt);
  }else{
    const st=stripCurrentTime(msgText(m));
    bubble.innerHTML=chips(escapeHtml(st.clean));
    // 真实图片
    msgImages(m).forEach(im=>{const img=document.createElement("img");img.src=im;bubble.appendChild(img);});
  }
  // token 标签
  if(m.role==="ai" && cfg.show_token && m.tokens){
    const tk=document.createElement("div");tk.className="tok";
    const pt=m.tokens.prompt_tokens,c=m.tokens.completion_tokens;
    if(pt!=null||c!=null){tk.textContent="↑"+(pt||0)+" ↓"+(c||0);}
    d.appendChild(tk);
  }
  // 多选勾选
  const check=document.createElement("span");check.className="check";check.textContent="✓";
  d.appendChild(check);
  d.appendChild(meta);d.appendChild(bubble);
  return d;
}
// 计算每条是否 QQ 分组：连续同角色 + 时间接近（<10分钟）
function groupCls(i){
  const m=msgs[i]; if(!m)return "";
  const prev=msgs[i-1]; if(!prev||prev.role!==m.role)return "";
  const t1=msgTime(prev),t2=msgTime(m);
  if(t1&&t2&&Math.abs(t1-t2)<10*60*1000){
    // 看下一条是否也同角色同时间，决定这是不是最后一条
    const next=msgs[i+1];
    const isLast=!(next&&next.role===m.role&&(msgTime(next)&&msgTime(m)&&Math.abs(msgTime(next)-msgTime(m))<10*60*1000));
    return isLast?"grp grp-last":"grp grp-mid";
  }
  return "";
}
function renderAll(){
  chatEl.innerHTML="";
  if(!msgs.length){chatEl.appendChild(emptyEl);scrollBottom();return;}
  let lastDay="";
  msgs.forEach((m,i)=>{
    const day=dayDivider(msgTime(m));
    const gcls=groupCls(i);
    if(day&&day!==lastDay){const dv=document.createElement("div");dv.className="day-divider";dv.textContent=day;chatEl.appendChild(dv);lastDay=day;}
    chatEl.appendChild(makeMsgEl(m,i,gcls));
  });
  scrollBottom();
}
function removeEmpty(){if(emptyEl&&chatEl.contains(emptyEl))emptyEl.remove();}
function appendTypingBox(){
  removeEmpty();
  const d=document.createElement("div");d.className="msg ai";d.dataset.idx="-1";
  d.innerHTML='<div class="bubble"><span class="typing"><i></i><i></i><i></i></span></div>';
  chatEl.appendChild(d);scrollBottom();
  return d;
}
function removeTyping(){
  const ms=chatEl.querySelectorAll(".msg.ai");
  const last=ms[ms.length-1];
  if(last&&last.querySelector(".typing"))last.remove();
}
function lastAIBubble(){
  const ms=chatEl.querySelectorAll(".msg.ai");
  return ms[ms.length-1]||null;
}
function showError(msg){
  removeTyping();
  const d=document.createElement("div");d.className="msg ai";
  d.innerHTML='<div class="bubble" style="color:#c97070">连接时遇到一点问题：'+escapeHtml(msg)+'</div>';
  chatEl.appendChild(d);scrollBottom();
}

/* ================= 发送 ================= */
// 组装发送给网关的消息；若"回传思考链"，assistant 带上 reasoning_content（多轮时模型可参考）
function buildMessages(list){
  const out=[];
  if(system_prompt && typeof system_prompt==="string" && system_prompt.trim())out.push({role:"system",content:system_prompt});
  list.forEach(m=>{
    let c=m.content;
    if(Array.isArray(c))c=c.map(x=>x.type==="image_url"?{type:"image_url",image_url:{url:x.image_url.url}}:{type:"text",text:(x.text||"")});
    const base={role:m.role,content:c};
    if(m.role==="assistant"&&cfg.send_thinking&&m.reasoning){base.reasoning_content=m.reasoning;}
    out.push(base);
  });
  return out;
}
async function request(finalMsgs){
  if(sending)return;
  sending=true;setSendState(true);aborter=new AbortController();
  const box=appendTypingBox();
  let full="",reasoning="",usage=null;
  try{
    const payload={
      model:"deepseek-v4-flash-vision-exp",
      stream:true,
      messages:buildMessages(finalMsgs),
      stream_options:{include_usage:true}
    };
    if(cfg.temperature!=null&&cfg.temperature!=="")payload.temperature=Number(cfg.temperature);
    if(cfg.top_p!=null&&cfg.top_p!=="")payload.top_p=Number(cfg.top_p);
    if(cfg.max_tokens!=null&&cfg.max_tokens!=="")payload.max_tokens=Number(cfg.max_tokens);
    const resp=await fetch(API,{
      method:"POST",
      headers:{"Content-Type":"application/json","Authorization":"Bearer "+api_key},
      body:JSON.stringify(payload),
      signal:aborter.signal
    });
    if(!resp.ok){const t=await resp.text().catch(()=>"");throw new Error("HTTP "+resp.status+" : "+(t.slice(0,200)||resp.statusText));}
    const reader=resp.body.getReader();
    const dec=new TextDecoder();let buf="";
    while(true){
      const {done,value}=await reader.read();
      if(done)break;
      buf+=dec.decode(value,{stream:true});
      let idx;
      while((idx=buf.indexOf("\n"))>=0){
        const line=buf.slice(0,idx);buf=buf.slice(idx+1);
        if(!line.startsWith("data:"))continue;
        const data=line.slice(5).trim();
        if(data==="[DONE]")continue;
        try{
          const json=JSON.parse(data);
          if(json.usage){usage=json.usage;}
          const delta=json.choices&&json.choices[0]&&json.choices[0].delta;
          if(delta){if(delta.content)full+=delta.content;if(delta.reasoning_content)reasoning+=delta.reasoning_content;}
          const b=lastAIBubble();if(b){renderAI(b.querySelector(".bubble"),full,reasoning);scrollBottom();}
        }catch(e){}
      }
    }
    // 入库
    finalMsgs.push({role:"assistant",content:full,reasoning:reasoning,time:new Date().toISOString(),tokens:usage});
    msgs=finalMsgs;saveMsgs();renderAll();
  }catch(err){
    if(err.name==="AbortError"){
      if(full){finalMsgs.push({role:"assistant",content:full,reasoning:reasoning,time:new Date().toISOString(),tokens:usage});}
      msgs=finalMsgs;saveMsgs();renderAll();
      if(full)showToast("已停止生成");
    }else{
      msgs=finalMsgs;showError(err.message);
    }
  }finally{
    sending=false;setSendState(false);aborter=null;
  }
}
async function send(){
  const text=inputEl.value.trim();
  if(sending)return;
  if(!text&&!imgData.length)return;
  if(!api_key){openSetup();return;}
  if(!msgs.length){
    msgs=loadMsgs();
    if(!msgs.length){
      const history=await fetchHistory();
      if(history&&history.length){msgs=history;saveMsgs();renderAll();}
    }
  }
  // 注入 current_time 标签（网关做时间/唤醒/特殊事件依赖）
  const timeTag=currentTimeTag();
  let userContent;
  if(imgData.length){
    userContent=[{type:"text",text:(text?timeTag+"\n"+text:timeTag)},...imgData.map(d=>({type:"image_url",image_url:{url:d}}))];
  }else{
    userContent=timeTag+"\n"+text;
  }
  msgs.push({role:"user",content:userContent,time:new Date().toISOString()});
  inputEl.value="";inputEl.style.height="auto";imgData=[];renderPreviews();
  updateSelBar();
  request(msgs);
}
function setSendState(on){
  if(on){sendBtn.classList.add("disabled","stop-btn");sendBtn.textContent="■";}
  else{sendBtn.classList.remove("disabled","stop-btn");sendBtn.textContent="➤";}
}
sendBtn.addEventListener("click",()=>{if(sending&&aborter){aborter.abort();return;}send();});
inputEl.addEventListener("input",()=>{inputEl.style.height="auto";inputEl.style.height=Math.min(inputEl.scrollHeight,120)+"px";});
inputEl.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send();}});

/* ================= 图片预览 ================= */
function renderPreviews(){
  previews.innerHTML="";
  imgData.forEach((im,i)=>{
    const p=document.createElement("div");p.className="preview";
    const ig=document.createElement("img");ig.src=im;
    const rm=document.createElement("button");rm.className="rm";rm.textContent="×";
    rm.onclick=()=>{imgData.splice(i,1);renderPreviews();};
    p.appendChild(ig);p.appendChild(rm);previews.appendChild(p);
  });
}
imgBtn.onclick=()=>fileInput.click();
fileInput.onchange=e=>{
  Array.from(e.target.files).forEach(f=>{
    const r=new FileReader();
    r.onload=()=>{imgData.push(r.result);renderPreviews();};
    r.readAsDataURL(f);
  });
  fileInput.value="";
};

/* ================= 操作菜单（长按） ================= */
function openAct(idx){
  if(idx==null||idx<0||sending)return;
  if(selectMode){toggleSelect(idx);return;}
  actIdx=idx;
  const m=msgs[idx];if(!m)return;
  actTitle.textContent=m.role==="user"?"我的消息":(cfg.ai_name||"AI")+"的消息";
  actCopy.style.display="flex";
  actEdit.style.display=m.role==="user"?"flex":"none";
  actRegen.style.display=m.role==="ai"?"flex":"none";
  actMulti.style.display="flex";
  actDel.style.display="flex";
  actMask.classList.add("show");actSheet.classList.add("show");
}
function closeAct(){actMask.classList.remove("show");actSheet.classList.remove("show");actIdx=-1;}
actMask.addEventListener("click",closeAct);
actCancel.addEventListener("click",closeAct);

function copyText(t){
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(()=>showToast("已复制"));}
  else{const ta=document.createElement("textarea");ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");showToast("已复制");}catch(e){}ta.remove();}
}
actCopy.addEventListener("click",()=>{if(actIdx>=0)copyText(msgText(msgs[actIdx]));closeAct();});

actDel.addEventListener("click",()=>{
  if(!sending&&actIdx>=0){msgs.splice(actIdx,1);saveMsgs();renderAll();}
  closeAct();
});

actEdit.addEventListener("click",()=>{
  const idx=actIdx;const m=msgs[idx];
  if(sending||!m)return;
  const t=msgText(m);
  const images=msgImages(m);
  inputEl.value=t;inputEl.style.height="auto";inputEl.style.height=Math.min(inputEl.scrollHeight,120)+"px";
  msgs=msgs.slice(0,idx);
  saveMsgs();
  if(images.length){imgData=images;renderPreviews();}else{imgData=[];renderPreviews();}
  renderAll();
  inputEl.focus();
  closeAct();
});

actRegen.addEventListener("click",()=>{
  const idx=actIdx;
  if(sending||idx<0)return;
  let ui=-1;
  for(let i=idx-1;i>=0;i--){if(msgs[i].role==="user"){ui=i;break;}}
  if(ui<0){showToast("前面没有可参考的消息");closeAct();return;}
  const base=msgs.slice(0,ui+1);
  msgs=base;saveMsgs();renderAll();
  updateSelBar();
  request(base);
  closeAct();
});

actMulti.addEventListener("click",()=>{
  closeAct();enterSelect();
});

/* ================= 多选 ================= */
function enterSelect(){
  if(sending||!msgs.length){showToast("暂无可选消息");return;}
  selectMode=true;selectSet.clear();
  selBar.classList.add("show");updateSelBar();
  renderAll();
}
function exitSelect(){
  selectMode=false;selectSet.clear();
  selBar.classList.remove("show");
  renderAll();
}
function updateSelBar(){
  selCount.textContent="已选 "+selectSet.size+" 条";
}
function toggleSelect(idx){
  const n=Number(idx);
  if(selectSet.has(n))selectSet.delete(n);else selectSet.add(n);
  updateSelBar();
  renderAll();
}
selCancel.addEventListener("click",exitSelect);
selAll.addEventListener("click",()=>{
  msgs.forEach((m,i)=>selectSet.add(i));
  updateSelBar();renderAll();
});
selDel.addEventListener("click",()=>{
  if(!selectSet.size){showToast("请先选择");return;}
  const indexes=Array.from(selectSet).sort((a,b)=>b-a);
  indexes.forEach(i=>msgs.splice(i,1));
  saveMsgs();selectSet.clear();updateSelBar();
  if(!msgs.length){exitSelect();}else{renderAll();}
  showToast("已删除 "+indexes.length+" 条");
});

/* 点击消息（多选模式下切换选中） */
chatEl.addEventListener("click",e=>{
  if(!selectMode)return;
  const el=e.target.closest(".msg");
  if(!el)return;
  const idx=el.dataset.idx;
  if(idx==null||idx<0)return;
  toggleSelect(idx);
});

/* 长按触发操作菜单 */
let pressTimer=null;
chatEl.addEventListener("touchstart",e=>{
  const el=e.target.closest(".msg");if(!el)return;
  const idx=el.dataset.idx;
  if(idx==null||idx<0)return;
  const startX=e.touches[0].clientX,startY=e.touches[0].clientY;
  pressTimer=setTimeout(()=>{openAct(Number(idx));navigator.vibrate&&navigator.vibrate(10);},500);
}, {passive:true});
["touchmove","touchend","touchcancel"].forEach(ev=>chatEl.addEventListener(ev,e=>{
  clearTimeout(pressTimer);
}, {passive:true}));
chatEl.addEventListener("contextmenu",e=>{
  const el=e.target.closest(".msg");if(!el)return;
  const idx=el.dataset.idx;if(idx==null||idx<0)return;
  e.preventDefault();openAct(Number(idx));
});

/* ================= 设置 ================= */
function renderPicks(){
  pickThinking.querySelectorAll("button").forEach(b=>{
    const k=b.dataset.k;
    b.classList.toggle("on",k==="show"?cfg.show_thinking:(k==="send"?cfg.send_thinking:false));
  });
  pickToken.querySelectorAll("button").forEach(b=>{
    b.classList.toggle("on",b.dataset.k==="token"?cfg.show_token:false);
  });
}
function applyHeader(){
  hdName.textContent=cfg.ai_name||"谢意行";
  hdSub.textContent=cfg.ai_sub||"一直在 · 陪你说话";
  const av=hdAvatar;
  av.textContent=(cfg.ai_name||"谢").trim().charAt(0);
  document.title=cfg.ai_name||"谢意行";
  const mt=document.querySelector('meta[name="apple-mobile-web-app-title"]');
  if(mt)mt.setAttribute("content",cfg.ai_name||"谢意行");
}
function openSetup(){
  keyInput.value=api_key;
  aiNameInput.value=cfg.ai_name||"谢意行";
  aiSubInput.value=cfg.ai_sub||"一直在 · 陪你说话";
  promptInput.value=system_prompt||"";
  tempInput.value=cfg.temperature!=null?cfg.temperature:"";
  topPInput.value=cfg.top_p!=null?cfg.top_p:"";
  maxTokInput.value=cfg.max_tokens!=null?cfg.max_tokens:"";
  renderPicks();
  setupMask.classList.remove("hidden");
}
menuBtn.onclick=openSetup;
cancelBtn.onclick=()=>setupMask.classList.add("hidden");
saveBtn.onclick=()=>{
  const k=keyInput.value.trim();
  if(!k){keyInput.focus();return;}
  api_key=k;
  system_prompt=(promptInput.value||"").trim();
  cfg.ai_name=aiNameInput.value.trim()||"谢意行";
  cfg.ai_sub=aiSubInput.value.trim()||"一直在 · 陪你说话";
  cfg.temperature=tempInput.value!==""?Number(tempInput.value):null;
  cfg.top_p=topPInput.value!==""?Number(topPInput.value):null;
  cfg.max_tokens=maxTokInput.value!==""?Number(maxTokInput.value):null;
  localStorage.setItem(LS_KEY,api_key);
  try{localStorage.setItem(LS_PROMPT,system_prompt);}catch(e){}
  saveCfg();
  applyHeader();renderPicks();
  setupMask.classList.add("hidden");
};
setupMask.addEventListener("click",e=>{if(e.target===setupMask)setupMask.classList.add("hidden");});
document.getElementById("noticeHead").onclick=function(){this.closest(".cc-notice").classList.toggle("open");};
// 开关按钮
pickThinking.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.k==="show"){cfg.show_thinking=!cfg.show_thinking;}
  else if(b.dataset.k==="send"){cfg.send_thinking=!cfg.send_thinking;}
  saveCfg();renderPicks();
});
pickToken.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.k==="token"){cfg.show_token=!cfg.show_token;}
  saveCfg();renderPicks();
});

/* ================= 初始化 ================= */
applyHeader();
async function init(){
  if(!api_key){openSetup();renderAll();return;}
  const history=await fetchHistory();
  if(history&&history.length){
    msgs=history;saveMsgs();
    renderAll();
    return;
  }
  msgs=loadMsgs();
  if(msgs.length)renderAll();
}
init();
</script>
</body>
