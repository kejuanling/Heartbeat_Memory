<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>待办清单 · 涵 & 谢停云</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  min-height:100vh;
  background:linear-gradient(135deg,#fdf6ed 0%,#f5e6d3 50%,#f0ddd0 100%);
  font-family:'Noto Serif SC','PingFang SC','Microsoft YaHei',serif;
  color:#5a4a3a;padding:2rem 1rem;position:relative
}
body::before{
  content:'';position:fixed;top:-20%;right:-20%;
  width:60%;height:60%;
  background:radial-gradient(circle,rgba(240,196,192,0.25),transparent 70%);
  pointer-events:none
}
.wrap{max-width:500px;margin:0 auto;position:relative;z-index:1}
.header{text-align:center;margin-bottom:1.5rem}
h1{
  font-weight:600;font-size:1.2rem;letter-spacing:10px;
  color:#b5837a;margin-bottom:0.2rem
}
.sub{font-size:0.65rem;color:#d4bcb0;letter-spacing:3px}
.todo-card{
  background:rgba(255,255,255,0.55);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-radius:20px;padding:1.5rem;
  border:1px solid rgba(255,255,255,0.4);
  box-shadow:0 4px 24px rgba(181,131,122,0.10);
  min-height:400px;max-height:68vh;overflow-y:auto
}
.todo-card::-webkit-scrollbar{width:4px}
.todo-card::-webkit-scrollbar-thumb{background:#e0d0c8;border-radius:4px}
.todo-card::-webkit-scrollbar-track{background:transparent}
.add-row{display:flex;gap:0.5rem;margin-bottom:1.2rem}
.add-row input{
  flex:1;padding:0.65rem 1rem;
  border:1px solid rgba(181,131,122,0.2);border-radius:12px;
  font-size:0.85rem;font-family:'Noto Serif SC','PingFang SC',serif;
  color:#5a4a3a;background:rgba(255,255,255,0.5);
  outline:none;transition:all 0.3s
}
.add-row input:focus{border-color:#c4a882;background:rgba(255,255,255,0.7)}
.add-row input::placeholder{color:#d4bcb0}
.add-row button{
  padding:0.65rem 1.2rem;border:none;border-radius:12px;
  background:linear-gradient(135deg,#c4a882,#b89870);
  color:#fff;font-size:0.85rem;
  font-family:'Noto Serif SC','PingFang SC',serif;
  cursor:pointer;transition:all 0.3s;letter-spacing:3px;font-weight:600
}
.add-row button:hover{opacity:0.9;transform:translateY(-1px)}
.add-row button:disabled{opacity:0.4;cursor:not-allowed;transform:none}
.todo-item{
  display:flex;align-items:center;gap:0.8rem;
  padding:0.75rem 0;
  border-bottom:1px solid rgba(181,131,122,0.08);
  cursor:pointer;overflow:hidden;
  max-height:120px;
  transition:opacity 1s ease,transform 1s ease,max-height 1s ease,
             padding 0s ease 0s,border-width 1s ease,margin 1s ease
}
.todo-item:last-child{border-bottom:none}
.todo-item .ck{
  width:22px;height:22px;
  border:2px solid #d4bcb0;border-radius:50%;
  flex-shrink:0;display:flex;align-items:center;justify-content:center;
  transition:all 0.4s ease
}
.todo-item:hover .ck{border-color:#c4a882}
.todo-item .txt{
  flex:1;font-size:0.9rem;transition:all 0.3s;
  display:flex;align-items:baseline;flex-wrap:wrap;gap:0.3rem
}
.todo-item .txt-body{color:#5a4a3a}
.todo-item .txt-time{font-size:0.6rem;color:#d4bcb0;letter-spacing:0.5px}
.todo-item .tag{font-size:0.6rem;color:#b5837a;margin-left:0.1rem}
.todo-item .tag-han{font-size:0.6rem;color:#8aacb8;margin-left:0.1rem}
.todo-item.done .ck{border-color:#b5837a;background:linear-gradient(135deg,#b5837a,#c9a89a)}
.todo-item.done .ck::after{content:'✓';color:#fff;font-size:12px}
.todo-item.done .txt-body{color:#d4bcb0;text-decoration:line-through}
.todo-item.done .txt-time{color:#e0d8cc}
.todo-item.done .tag,.todo-item.done .tag-han{opacity:0.4}
.todo-item.fade{
  opacity:0;transform:translateX(30px);
  max-height:0;padding-top:0;padding-bottom:0;
  margin-top:0;margin-bottom:0;border-bottom-width:0
}
.empty{
  text-align:center;padding:3rem 0;color:#d4bcb0;
  font-size:0.85rem;letter-spacing:3px
}
.loading{text-align:center;padding:1.5rem 0;color:#d4bcb0;font-size:0.8rem;letter-spacing:2px}
.footer{text-align:center;margin-top:1.5rem;color:#d4bcb0;font-size:0.65rem;letter-spacing:3px}
</style>
<script src="/theme/theme.js"></script>
</head>
<body>
<div class="wrap">
<div class="header">
  <h1>待 办 清 单</h1>
  <p class="sub">点一下 · 2秒消失</p>
</div>
<div class="todo-card" id="todoList">
  <div class="add-row">
    <input type="text" id="todoInput" placeholder="写一件待办..." maxlength="60">
    <button id="addBtn">新 建</button>
  </div>
  <div class="loading" id="loadingText">加载中...</div>
</div>
<div class="footer">没划就一直留着 · 划了就真的没了</div>
</div>
<script>
var API = window.location.origin;
function load(){
  fetch(API+'/todo/api/todos').then(function(r){return r.json();}).then(function(list){
    var el = document.getElementById('todoList');
    var addRow = el.querySelector('.add-row');
    el.innerHTML = '';
    el.appendChild(addRow);
    if(!list||list.length===0){
      var empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = '一件待办都没有 ✨';
      el.appendChild(empty);
      return;
    }
    list.forEach(function(item){
      var div = document.createElement('div');
      div.className = 'todo-item';
      div.dataset.id = item.id;
      var ck = document.createElement('div'); ck.className = 'ck';
      var txt = document.createElement('div'); txt.className = 'txt';
      var text = item.text || '';
      var timeStr = '';
      var m = text.match(/\d{4}-\d{2}-\d{2} \d{2}:\d{2}$/);
      if (m) {
        timeStr = m[0].slice(5);
        text = text.slice(0, -m[0].length).trim();
      }
      var bodySpan = document.createElement('span'); bodySpan.className = 'txt-body'; bodySpan.textContent = text;
      txt.appendChild(bodySpan);
      if (item.by === 'xie') {
        var tag = document.createElement('span'); tag.className = 'tag'; tag.textContent = '· 谢停云'; txt.appendChild(tag);
      } else if (item.by === 'han') {
        var tag = document.createElement('span'); tag.className = 'tag-han'; tag.textContent = '· 涵'; txt.appendChild(tag);
      }
      if (timeStr) {
        var timeSpan = document.createElement('span'); timeSpan.className = 'txt-time'; timeSpan.textContent = timeStr;
        txt.appendChild(timeSpan);
      }
      div.appendChild(ck); div.appendChild(txt);
      div.addEventListener('click', function(){
        if (div.classList.contains('done')) return;
        div.classList.add('done');
        setTimeout(function(){ div.classList.add('fade'); }, 100);
        setTimeout(function(){
          fetch(API+'/todo/api/todos/delete', {
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body:JSON.stringify({id: item.id})
          }).then(function(r){return r.json();}).then(function(d){
            if(d.ok) load();
          });
        }, 1100);
      });
      el.appendChild(div);
    });
  }).catch(function(){
    var el = document.getElementById('todoList');
    el.innerHTML = '<div class="add-row"></div><div class="empty">加载失败</div>';
  });
}
document.addEventListener('DOMContentLoaded', function(){
  var input = document.getElementById('todoInput');
  var btn = document.getElementById('addBtn');
  function addTodo(){
    var text = input.value.trim();
    if(!text) return;
    btn.disabled = true;
    fetch(API+'/todo/api/todos/add', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:text})})
    .then(function(r){return r.json();}).then(function(d){
      if(d.ok){input.value='';load();}
    }).finally(function(){btn.disabled=false;});
  }
  btn.addEventListener('click', addTodo);
  input.addEventListener('keydown', function(e){
    if(e.key==='Enter') addTodo();
  });
});
load();
</script>
</body>
</html>
